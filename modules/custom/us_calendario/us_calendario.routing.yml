us_calendario.pagina:
  path: '/servicios-a-la-ciudadania/Mecanismos-de-participacion/calendario'
  defaults:
    _controller: '\Drupal\us_calendario\Controller\CalendarioController::pagina'
    _title: 'Calendario de eventos'
  requirements:
    _permission: 'access content'

us_calendario.eventos:
  path: '/servicios-a-la-ciudadania/calendario/eventos.json'
  defaults:
    _controller: '\Drupal\us_calendario\Controller\CalendarioController::eventos'
  methods: [GET]
  requirements:
    _permission: 'access content'

# Ruta anterior: redirige de forma permanente a la nueva.
us_calendario.antigua:
  path: '/calendario'
  defaults:
    _controller: '\Drupal\us_calendario\Controller\CalendarioController::redirigir'
  requirements:
    _permission: 'access content'

us_calendario.antigua_eventos:
  path: '/calendario/eventos.json'
  defaults:
    _controller: '\Drupal\us_calendario\Controller\CalendarioController::redirigirEventos'
  methods: [GET]
  requirements:
    _permission: 'access content'
